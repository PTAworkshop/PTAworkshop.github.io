---
layout: default
title: Schedule
description: Full-day program for the PTA @ NeurIPS 2026 workshop.
---

<div class="page-banner">
  <div class="container">
    <h1>Schedule</h1>
    <p class="page-banner-sub">Draft schedule — subject to change.</p>
  </div>
</div>

<div class="container page-content">
  <div class="schedule-wrap">
    <table class="schedule-table">
      <thead>
        <tr>
          <th class="col-time">Time</th>
          <th>Event</th>
        </tr>
      </thead>
      <tbody>
        {% for item in site.data.schedule %}
        <tr class="{{ item.type }}">
          <td class="col-time">{{ item.time }}</td>
          <td>{{ item.event }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
