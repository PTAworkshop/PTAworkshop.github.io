<div class="people-grid">
  {% for person in include.people %}
  <div class="person-card">
    <div class="person-photo-wrap">
      <img class="person-photo" src="{{ person.image | relative_url }}" alt="Photo of {{ person.name }}" onerror="this.onerror=null;this.src='{{ '/assets/images/placeholder-avatar.svg' | relative_url }}';">
    </div>
    <div class="person-name">
      {% if person.url %}<a href="{{ person.url }}" target="_blank" rel="noopener">{{ person.name }}</a>{% else %}{{ person.name }}{% endif %}
    </div>
    <div class="person-affiliation">{{ person.affiliation | default: person.title }}</div>
    {% if person.url %}<a class="person-link" href="{{ person.url }}" target="_blank" rel="noopener">Personal page &rarr;</a>{% endif %}
  </div>
  {% endfor %}
</div>
