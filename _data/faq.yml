# Add a question by copying a block below. Remove a question by deleting its block.
# `question` is the heading. `answer` supports Markdown (links, bold, lists).
- question: Can I present the same paper at multiple NeurIPS workshops?
  answer: >-
    Yes. PTA allows papers to be presented at multiple NeurIPS workshops.
    However, please check the policies of the other workshops to ensure they
    also permit multiple presentations.

- question: Is there a reserved registration spot for accepted papers?
  answer: >-
    Yes. Each accepted workshop paper has one reserved author registration spot,
    which is allocated on a first-come, first-served basis to whichever
    co-author registers first.

- question: What is the attendance requirement for accepted papers?
  answer: >-
    For each accepted paper, at least one author should attend the workshop in person and present the poster by default.

- question: Is financial support available for accepted authors?
  answer: >-
    Unfortunately, we currently do not have funding available to provide travel
    grants, registration waivers, or other financial support for accepted
    authors. We appreciate your understanding.
